# =============================================================================
# SonarQube — notification-service (Java/Spring Boot)
# Conformité DSI §2 : SonarQube Quality Gate A bloquant
# =============================================================================

sonar.projectKey=d2f_notification
sonar.projectName=d2f_notification
sonar.projectVersion=2026.01.01.0

# Sources & Tests
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Rapports
sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Configuration de la couverture de code
sonar.java.coveragePlugin=jacoco
sonar.coverage.exclusions=**/dto/**,**/entity/**,**/config/SecurityConfig.java,**/config/SecurityConfig$*.java,**/config/OpenApiConfig.java,**/config/RabbitMqConfig.java,**/config/NotificationDataSeeder.java,**/NotificationServiceApplication.java,**/websocket/WebSocketAuthInterceptor.java,**/exception/**,**/messaging/**

# Encodage
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/target/**,**/*.class,**/generated-sources/**
sonar.test.exclusions=**/target/**

# Token d'authentification SonarQube
sonar.token=${env.SONAR_TOKEN}
