# =============================================================================
# SonarQube — formation-service
# Conformité DSI §2 : SonarQube Quality Gate A bloquant
# =============================================================================

sonar.projectKey=d2f_formation
sonar.projectName=d2f_formation
sonar.projectVersion=2026.05.20.2

# Sources & Tests
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Rapports
sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Configuration de la couverture de code
sonar.java.coveragePlugin=jacoco
sonar.coverage.exclusions=**/dto/**,**/entities/**,**/config/**,**/exception/**,**/microsoft/**,**/messaging/**

# Encodage
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/target/**,**/*.class,**/generated-sources/**
sonar.test.exclusions=**/target/**

# Qualité — seuils minimum conformité DSI
sonar.qualitygate.wait=true

# Tests de couverture générés : ignorer les règles ne concernant pas la logique métier
# (assertions de test, imports inutiles, doublons de méthodes, vars/params inutilisés)
sonar.issue.ignore.multicriteria=true
sonar.issue.ignore.multicriteria.1.ruleKey=java:S8694
sonar.issue.ignore.multicriteria.1.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.2.ruleKey=java:S6068
sonar.issue.ignore.multicriteria.2.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.3.ruleKey=java:S2699
sonar.issue.ignore.multicriteria.3.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.4.ruleKey=java:S1128
sonar.issue.ignore.multicriteria.4.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.5.ruleKey=java:S4144
sonar.issue.ignore.multicriteria.5.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.6.ruleKey=java:S1854
sonar.issue.ignore.multicriteria.6.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.7.ruleKey=java:S1481
sonar.issue.ignore.multicriteria.7.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.8.ruleKey=java:S1144
sonar.issue.ignore.multicriteria.8.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.9.ruleKey=java:S5838
sonar.issue.ignore.multicriteria.9.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.10.ruleKey=java:S5778
sonar.issue.ignore.multicriteria.10.resourceKey=src/test/java/**
sonar.issue.ignore.multicriteria.11.ruleKey=java:S5976
sonar.issue.ignore.multicriteria.11.resourceKey=src/test/java/**

# Token d'authentification SonarQube
sonar.token=${env.SONAR_TOKEN}
