server {
  listen       80;
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  # ── Reverse proxy: API Gateway ────────────────────────────────────────────
  # Le frontend (même origine) appelle /api/... → nginx proxy vers le gateway.
  # Élimine les problèmes CORS et SameSite=Strict cross-origin (port different).
  location /api/ {
    proxy_pass http://d2f-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_buffering off;
    # Transmettre les cookies (Set-Cookie avec SameSite=Strict)
    proxy_cookie_flags ~ SameSite=Strict;
  }

  # ── Security headers (conformité DSI §12) ─────────────────────────────────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  # CSP: connect-src uniquement self (toutes les API passent par le proxy nginx).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.esprit.tn https://*.esprit.tn:8222 http://192.168.3.11:8222; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

  gzip on;
  gzip_types text/plain application/javascript application/json text/css text/xml application/xml application/xml+rss text/javascript;

  # index.html : jamais mis en cache — garantit que le navigateur récupère
  # toujours la dernière version référençant les bons chunks hachés.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fichiers hachés (contenu immuable) : cache long sans revalidation.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
