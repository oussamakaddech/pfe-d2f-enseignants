# SPRING
spring.main.allow-bean-definition-overriding=true
spring.application.name=besoinsformation-service

# DATASOURCE

spring.datasource.url=jdbc:postgresql://192.168.3.11:7432/d2f

spring.datasource.username=d2f
spring.datasource.password=REDACTED_DB_PASSWORD

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ARTEMIS (JMS)
spring.artemis.mode=native
spring.artemis.broker-url=tcp://192.168.3.11:61616
spring.artemis.user=admin
spring.artemis.password=admin
spring.artemis.embedded.enabled=false


# SERVER
server.port=8004


# JWT
jwt.secret=REDACTED_ROTATED_SECRET

# LOGGING
logging.level.org.springframework.security=DEBUG
