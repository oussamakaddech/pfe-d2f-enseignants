# =============================================================================
# SonarQube 26.x LTS — PostgreSQL-backed (replaces volatile embedded H2)
# =============================================================================
# Fixes DSI §3.5 — SonarQube must use an external database (not embedded H2)
# so analysis history survives container restarts.
# Usage:
#   docker compose -f infra/sonarqube/sonarqube-compose.yml up -d
#   docker compose -f infra/sonarqube/sonarqube-compose.yml down -v
# =============================================================================
services:
  db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    networks:
      - sonarnet
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    networks:
      - sonarnet
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q UP || exit 1"]
      interval: 45s
      timeout: 15s
      retries: 30
      start_period: 60s

networks:
  sonarnet:
    driver: bridge

volumes:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
