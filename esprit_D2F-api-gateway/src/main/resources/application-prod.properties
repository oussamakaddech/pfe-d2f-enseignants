# Production Environment Configuration
# Server
server.port=8080

# Application
spring.application.name=service-gateway

# Gateway Discovery
spring.cloud.config.enabled=false

# Routes : definis dans routes.yml (importe par application.properties).
# Ne pas redefinir ici avec lb:// — aucun Eureka dans la stack Docker.
# Les URLs des services sont injectees via variables d'environnement dans docker-compose.

# Spring Main
spring.main.allow-bean-definition-overriding=true

# Logging Configuration for Production
logging.level.org.springframework.cloud.gateway=WARN
logging.level.com.example.servicegateway=INFO
logging.level.org.springframework=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Health and Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# OpenAPI / Swagger : desactives en production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Tracing distribue
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
logging.pattern.level=%5p [%X{traceId:-},%X{spanId:-}]

# JVM Configuration for Production
server.tomcat.max-threads=200
server.tomcat.max-connections=10000
spring.jpa.show-sql=false

# Security Configuration
server.error.include-stacktrace=never
server.error.include-message=never

########################################
# CORS Configuration (PROD / Docker)
########################################
# Indispensable : le front (nginx :3000) et le dev server (Vite :5173) sont
# cross-origin vis-a-vis de la gateway (:8080). Sans ce globalcors, le gateway
# rejette les preflight OPTIONS (403) et le navigateur bloque les appels
# credentials -> toast "Pas de connexion au serveur".
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://qa-frontend:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=https://esprit-d2f.esprit.tn
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[2]=${CORS_ORIGIN_LOCAL_3000:http://localhost:3000}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[3]=${CORS_ORIGIN_LOCAL_5173:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[5]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
