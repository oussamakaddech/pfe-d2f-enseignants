# Spring Main
spring.main.allow-bean-definition-overriding=true

  # Application
spring.application.name=evaluation-service

  # Datasource


spring.datasource.url=jdbc:postgresql://192.168.3.11:7432/d2f

spring.datasource.username=d2f
spring.datasource.password=REDACTED_DB_PASSWORD
  # JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

  # Artemis JMS
spring.artemis.mode=native
spring.artemis.broker-url=tcp://192.168.3.11:61616
spring.artemis.user=admin
spring.artemis.password=admin
spring.artemis.embedded.enabled=false
  # JMS Listener
spring.jms.listener.acknowledge-mode=auto

  # Server
server.port=8087


  # JWT
jwt.secret=REDACTED_ROTATED_SECRET

  # Logging
logging.level.org.springframework.security=DEBUG