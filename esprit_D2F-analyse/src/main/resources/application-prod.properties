server.port=8089
server.error.include-stacktrace=never

# URLs des microservices (overridables via env vars ; fallbacks = ports locaux)
services.auth.url=${SERVICES_AUTH_URL:http://localhost:8085}
services.evaluation.url=${SERVICES_EVALUATION_URL:http://localhost:8087}
services.formation.url=${SERVICES_FORMATION_URL:http://localhost:8088}
services.competence.url=${SERVICES_COMPETENCE_URL:http://localhost:8005}
services.certificat.url=${SERVICES_CERTIFICAT_URL:http://localhost:8086}
services.besoin-formation.url=${SERVICES_BESOIN_FORMATION_URL:http://localhost:8004}
services.predictive.url=${SERVICES_PREDICTIVE_URL:http://localhost:8000}

# Actuator : exposition minimale en production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# OpenAPI / Swagger : desactives en production (ne pas exposer la surface API).
springdoc.swagger-ui.enabled=false
# Description : documentation OpenAPI exposée (JSON) pour validation DSI ;
# seule l'UI graphique (swagger-ui) est désactivée en production.
springdoc.api-docs.enabled=true

# Tracing distribue
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
logging.pattern.level=%5p [%X{traceId:-},%X{spanId:-}]