# Configuration des identifiants par defaut pour l'administrateur
# IMPORTANT: Ces valeurs doivent etre modifiees en production!

# Nom d'utilisateur par defaut
app.security.default-admin.username=${APP_SECURITY_DEFAULT_ADMIN_USERNAME:admin}

# Mot de passe injecte depuis la variable d'environnement APP_SECURITY_DEFAULT_ADMIN_PASSWORD
app.security.default-admin.password=${APP_SECURITY_DEFAULT_ADMIN_PASSWORD:CHANGE_ME_IN_PRODUCTION}

# Informations personnelles par defaut
app.security.default-admin.first-name=System
app.security.default-admin.last-name=Admin
app.security.default-admin.phone=00000000
app.security.default-admin.email=${ADMIN_EMAIL:admin@d2f.local}
